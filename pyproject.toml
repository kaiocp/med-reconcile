[tool.poetry]
name = "med-reconcile"
version = "0.1.0"
description = "Medication reconciliation service: FHIR-sourced patient context + drug interaction checks + LLM-generated clinical summary with deterministic verification."
authors = ["Kaio Pedreira <80350711+kaiocp@users.noreply.github.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136.1"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = "^1.3.0"
pytest-bdd = "^8.1.0"
httpx = "^0.27.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
pip-audit = "^2.7.0"
setuptools = "^78.1.1"
pip = "^26.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff — single tool for lint + format (replaces black + flake8 + isort).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["deliverables", "research", "reviewers"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RET", # flake8-return (return-statement consistency)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # re-exports are intentional in package roots

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict mode across application code, relaxed on tests.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["deliverables", "research", "reviewers"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# pytest configuration.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers --strict-config"
asyncio_mode = "auto"
