services:
  reconciliation-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: med-reconcile:local
    container_name: med-reconcile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
